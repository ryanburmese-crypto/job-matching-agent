name: Daily Job Matching Agent

# 📌 ဤနေရာတွင် Event Trigger ကို သေချာ သတ်မှတ်ပေးရန် လိုအပ်သည်
on:
  schedule:
    - cron: '0 23 * * *' # နေ့စဉ် ည ၁၁နာရီ (UTC) တွင် အလိုအလျောက် Run မည်
  workflow_dispatch:      # GitHub UI မှ Manual ဖြင့် လက်ဖြင့် နှိပ်၍ Run နိုင်ရန်

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
